[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bm25s>=0.3.11",
    "chonkie[code]>=1.7.0",
    "tree-sitter-language-pack<1.16",
    "fire>=0.7.1",
    "pydantic>=2.13.4",
    "tqdm>=4.70.0",
    "transformers>=5.17.0",
    "torch>=2.14.0",
    "accelerate>=1.15.0",
]

[dependency-groups]
dev = [
    "types-requests>=2.33.0.20260906",
    "types-tqdm>=4.70.0.20260906",
]


[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "pydantic.*",
    "chonkie.*",
    "bm25s.*",
    "fire.*",
    "tqdm.*",
]
ignore_missing_imports = true
disallow_subclassing_any = false
